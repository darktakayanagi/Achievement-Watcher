<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Achievement Notification</title>
    <meta name="duration" content="8000" />
    <meta width="450" height="150" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="notification">
      <div class="loader-wrapper">
        <div class="achievement-loader"></div>
        <div class="achievement-loader"></div>
        <div class="achievement-loader"></div>
      </div>
      <div class="icon">
        <img src="" alt="Icon" />
      </div>
      <div class="text">
        <div class="title"></div>
        <div class="desc"></div>
      </div>
    </div>
    <script>
      function resetAnimations(element) {
        // Reset all child animations
        element.querySelectorAll('*').forEach((el) => {
          const prev = el.style.animation;
          el.style.animation = 'none'; // stop animation
          void el.offsetWidth; // force reflow
          el.style.animation = prev; // restore original animation
        });

        // Reset the container itself
        const prevContainerAnim = element.style.animation;
        element.style.animation = 'none';
        void element.offsetWidth;
        element.style.animation = prevContainerAnim;
      }
      window.addEventListener('DOMContentLoaded', () => {
        window.api?.onNotification?.((notificationData) => {
          document.querySelector('.title').textContent = notificationData.displayName;
          document.querySelector('.desc').textContent = notificationData.description;
          document.querySelector('.icon img').src = notificationData.iconPath;
          const root = document.body;
          const scale = parseFloat(notificationData.scale || 1);
          root.style.transform = `scale(${scale})`;
          root.style.transformOrigin = 'center center';
          root.style.setProperty('--duration', notificationData.duration);

          resetAnimations(document.querySelector('.notification'));

          // Read duration from <meta name="duration">
          const durationMeta = document.querySelector('meta[name="duration"]');
          const duration = (parseFloat(durationMeta?.content) || 4000) * notificationData.duration;

          setTimeout(() => {
            window.api.closeNotificationWindow();
          }, duration);
        });
      });
    </script>
  </body>
</html>
